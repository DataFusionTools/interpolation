[tox]
minversion = 4.0
envlist = py312, py313, py314
isolated_build = true
allowlist_externals=rm

[gh-actions]
python =
    3.12: py312`n    3.13: py313`n    3.14: py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}
